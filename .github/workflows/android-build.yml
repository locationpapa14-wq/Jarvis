name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: locate
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found: $WRAPPER"

      - name: Fix Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Prepare Android source files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p src/main/java/com/jarvis/assistant
          mkdir -p src/main/res/layout
          mkdir -p src/main/res/drawable
          mkdir -p src/main/res/values
          mkdir -p src/main/res/xml
          mkdir -p src/main/assets

          cp AndroidManifest.xml src/main/AndroidManifest.xml

          cp ./*.kt src/main/java/com/jarvis/assistant/

          cp activity_main.xml src/main/res/layout/
          cp activity_settings.xml src/main/res/layout/
          cp item_chat_turn.xml src/main/res/layout/
          cp sheet_chat_history.xml src/main/res/layout/

          cp bg_*.xml src/main/res/drawable/
          cp ic_*.xml src/main/res/drawable/
          cp pill_jarvis_title.xml src/main/res/drawable/

          cp colors.xml src/main/res/values/
          cp strings.xml src/main/res/values/
          cp themes.xml src/main/res/values/
          cp jarvis_device_strings.xml src/main/res/values/

          cp jarvis_accessibility_service.xml src/main/res/xml/
          cp network_security_config.xml src/main/res/xml/

          cp index.html src/main/assets/

          cat > src/main/res/drawable/bg_power_button.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#FF3B82F6" />
          </shape>
          EOF

          echo "Android source files prepared."

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          bash ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
