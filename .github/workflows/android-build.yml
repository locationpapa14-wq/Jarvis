name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: locate
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found: $WRAPPER"

      - name: Fix Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          head -n 1 gradlew
          chmod +x gradlew
          ls -l gradlew
          command -v bash

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          bash ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
